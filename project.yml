# Xcode project definition. The .xcodeproj is generated from this by XcodeGen
# (on GitHub's Mac runners or Codemagic, or locally with `brew install xcodegen && xcodegen`).
name: HollowManor
options:
  bundleIdPrefix: com.hollowmanor
  deploymentTarget:
    iOS: "17.0"
packages:
  ManorCore:
    path: Packages/ManorCore
targets:
  HollowManor:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Voices/manifest.json"
    dependencies:
      - package: ManorCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hollow Manor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hollowmanor.HollowManor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - HollowManorUITests
  HollowManorUITests:
    # Apple's Accessibility Audit on every screen. Run by the "Accessibility check" workflow.
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: HollowManor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hollowmanor.HollowManorUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: HollowManor
