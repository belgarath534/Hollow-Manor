name: Tests

# The game's tests, on every push. Linux only, so it never waits for a Mac (about a minute).
# The iPhone app itself is built by the TestFlight workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Game tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run ManorCore tests
        working-directory: Packages/ManorCore
        run: swift test
